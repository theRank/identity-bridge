name: Publish

# Publishes @therank/identity-bridge-client and @therank/identity-bridge-server to npm when a v* tag is pushed,
# both at the tag's version; the version change is not committed. Runs the same checks as the Test workflow first.
# Started by hand (workflow_dispatch), it always stops at a dry run under a placeholder version, so the workflow
# can be exercised without a tag.
#
# npm authenticates the publish through trusted publishing (OIDC, hence id-token: write), configured on npmjs.com
# for each package with this repository and this workflow file. npm can configure it only for a package that
# already exists, so the first version of each package is published by hand. Provenance is added automatically
# once the repository is public.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test packages under Node
        run: npm run test:node --workspaces --if-present

      - name: Version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$DRY_RUN" = true ]; then version=0.0.0-dry-run; else version="${TAG#v}"; fi
          npm version "$version" --workspaces --no-git-tag-version --allow-same-version

      # npm requires a dist-tag for a prerelease version such as the dry run's placeholder
      - name: Publish
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --workspaces --dry-run --tag dry-run
          else
            npm publish --workspaces
          fi
