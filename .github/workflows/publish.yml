name: Publish

# Publishes @therank/identity-bridge-client and @therank/identity-bridge-server to npm when a v* tag is pushed,
# both at the tag's version; the version change is not committed. The dist-tag follows the release workflow's rule
# for the image's latest: latest only for the highest version that is not a prerelease, among all v* tags,
# release-X.Y for a patch to an older line, and next for a prerelease. Started by hand (workflow_dispatch), it
# always stops at a dry run under a placeholder version, so the workflow can be exercised without a tag.
#
# Two jobs, so install scripts and test code never run where an OIDC token can be minted: check installs, typechecks,
# tests and builds with read-only permissions; publish installs without scripts, builds the packages and publishes.
# npm authenticates the publish through trusted publishing (OIDC, hence id-token: write), configured on npmjs.com for
# each package with this repository, this workflow file and the npm environment, where protection rules can be
# added. npm can configure it only for a package that already exists, so the first version of each package is
# published by hand. Provenance is added automatically once the repository is public.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test packages under Node
        run: npm run test:node --workspaces --if-present

  publish:
    name: publish
    needs: check
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No npm cache here: this job only trusts what npm ci downloads and verifies itself
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install without scripts
        run: npm ci --ignore-scripts

      # The packages only: the root build runs wrangler, which needs install scripts
      - name: Build the packages
        run: npm run build --workspaces

      - name: Check npm supports trusted publishing
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $current is older than $required, the first npm with trusted publishing"
            exit 1
          fi

      # The same strict check of the tag as the release workflow's, refusing build metadata, and the same lookup of
      # the v* tags through the API, which contents: read allows, to choose the dist-tag
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            version=0.0.0-dry-run
            dist_tag=dry-run
          else
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' \
              > "$RUNNER_TEMP/tags"
            node scripts/release-tag.ts "$TAG" "$RUNNER_TEMP/tags" > "$RUNNER_TEMP/version"
            cat "$RUNNER_TEMP/version"
            version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/version")
            dist_tag=$(sed -n 's/^dist_tag=//p' "$RUNNER_TEMP/version")
          fi
          npm version "$version" --workspaces --no-git-tag-version --allow-same-version --ignore-scripts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # The packages were built above, so no lifecycle script runs here. The dist-tag is always given: without one,
      # npm would move latest to any version it publishes.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --workspaces --ignore-scripts --dry-run --tag "$DIST_TAG"
          else
            npm publish --workspaces --ignore-scripts --tag "$DIST_TAG"
          fi
