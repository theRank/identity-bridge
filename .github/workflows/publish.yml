name: Publish

# Tags publish both packages; manual runs are dry runs. scripts/release-tag.ts chooses the npm dist-tag.
# Package versions are set for publishing without a version commit.
#
# Tests run in the read-only job; publishing disables install scripts and receives OIDC permission.
# Configure npm trusted publishing for each package with this workflow and the npm environment.
# The first version of a new package must be published manually before configuring trusted publishing.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test packages under Node
        run: npm run test:node --workspaces --if-present

  publish:
    name: publish
    needs: check
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No npm cache here: this job only trusts what npm ci downloads and verifies itself
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install without scripts
        run: npm ci --ignore-scripts

      # The packages only, so wrangler and esbuild never run in the job that can mint an OIDC token
      - name: Build the packages
        run: npm run build --workspaces

      - name: Check npm supports trusted publishing
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $current is older than $required, the first npm with trusted publishing"
            exit 1
          fi

      # Listing the v* tags through the API needs only contents: read
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            version=0.0.0-dry-run
            dist_tag=dry-run
          else
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' \
              > "$RUNNER_TEMP/tags"
            node scripts/release-tag.ts "$TAG" "$RUNNER_TEMP/tags" > "$RUNNER_TEMP/version"
            cat "$RUNNER_TEMP/version"
            version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/version")
            dist_tag=$(sed -n 's/^dist_tag=//p' "$RUNNER_TEMP/version")
          fi
          npm version "$version" --workspaces --no-git-tag-version --allow-same-version --ignore-scripts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # The packages were built above, so no lifecycle script runs here. The dist-tag is always given: without one, npm
      # would tag latest, or refuse a prerelease or a version below the highest published.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --workspaces --ignore-scripts --dry-run --tag "$DIST_TAG"
          else
            npm publish --workspaces --ignore-scripts --tag "$DIST_TAG"
          fi
