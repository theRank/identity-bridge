name: Release

# Releases the service when a v* tag is pushed: the GitHub release for the tag, with the single-file Node bundle
# server.mjs and its SHA-256 sum attached, marked as a prerelease when the version has a -; and the container image
# for linux/amd64 and linux/arm64 on GitHub Container Registry, tagged X.Y.Z, plus X.Y and latest for a version
# that is not a prerelease. Started by hand (workflow_dispatch), it checks, builds the bundle and the image under a
# placeholder version, and publishes nothing.
#
# Three jobs, so install scripts and test code never run where anything can be published: check installs,
# typechecks, tests and builds with read-only permissions; release installs without scripts, bundles and creates
# the release; image builds the Dockerfile, whose build stage installs without scripts too, and pushes it.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test packages under Node
        run: npm run test:node --workspaces --if-present

  release:
    name: release
    needs: check
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No npm cache here: this job only trusts what npm ci downloads and verifies itself
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Docker tags cannot hold the + of semver build metadata, so a version must be X.Y.Z or X.Y.Z-pre
      - name: Version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            version=0.0.0-dry-run
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::$TAG is not a v-prefixed X.Y.Z or X.Y.Z-prerelease version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install without scripts
        run: npm ci --ignore-scripts

      - name: Bundle
        run: npm run build:node

      - name: Checksum
        working-directory: dist/node
        run: |
          sha256sum server.mjs > server.mjs.sha256
          cat server.mjs.sha256

      - name: Create the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/node/server.mjs dist/node/server.mjs.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"

  image:
    name: image
    needs: check
    if: github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GHCR names must be lowercase, and the owner's name may not be
      - name: Tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            version=0.0.0-dry-run
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::$TAG is not a v-prefixed X.Y.Z or X.Y.Z-prerelease version"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/identity-bridge"
          tags="$image:$version"
          if [[ "$version" != *-* ]]; then tags="$tags,$image:${version%.*},$image:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The checkout as the context, so .dockerignore decides what the build sees
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ env.DRY_RUN != 'true' }}
