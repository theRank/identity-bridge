name: Clerk

# Check real Clerk tokens and claims for upstream changes. Keep this external-service check out of required checks.

on:
  pull_request:
    paths:
      - src/**
      - scripts/e2e-clerk.ts
      - package-lock.json
      - .github/workflows/clerk.yml
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # The development-instance secret is unavailable to forks and Dependabot.
    if: >-
      (github.event_name != 'pull_request' && github.repository == 'theRank/identity-bridge') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'theRank/identity-bridge' && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the Node bundle
        run: npm run build:node

      - name: End-to-end test
        run: node scripts/e2e-clerk.ts
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_E2E_SECRET_KEY }}
          CLERK_ISSUER: https://verified-monkfish-6997.clerk.accounts.dev
