name: Casdoor

# The bridge against a real Casdoor. The version the docs were checked against runs on changes to the service, to
# catch a change of ours; Casdoor's newest release runs beside it weekly, to notice when Casdoor changes what the
# bridge relies on. Nothing here deploys or publishes.

on:
  pull_request:
    paths:
      - src/**
      - scripts/e2e-casdoor.ts
      - package-lock.json
      - .github/workflows/casdoor.yml
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.casdoor }})
    # A fork's weekly run would tell its owner nothing they can act on
    if: github.event_name != 'schedule' || github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        casdoor: ${{ fromJSON(github.event_name == 'pull_request' && '["pinned"]' || '["pinned", "latest"]') }}
    env:
      # Without an image the script runs the version it names, the one of docs/idp-casdoor.md
      IMAGE: ${{ matrix.casdoor == 'latest' && 'casbin/casdoor-all-in-one:latest' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the Node bundle
        run: npm run build:node

      - name: End-to-end test
        run: node scripts/e2e-casdoor.ts ${IMAGE:+"$IMAGE"}
