name: Casdoor

# Pin Casdoor on PRs to detect our regressions; also check latest on scheduled/manual runs for upstream changes.

on:
  pull_request:
    paths:
      - src/**
      - scripts/e2e-casdoor.ts
      - package-lock.json
      - .github/workflows/casdoor.yml
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.casdoor }})
    if: github.event_name != 'schedule' || github.repository == 'theRank/identity-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        casdoor: ${{ fromJSON(github.event_name == 'pull_request' && '["pinned"]' || '["pinned", "latest"]') }}
    env:
      # Empty selects the script's pinned version, matching docs/idp-casdoor.md.
      IMAGE: ${{ matrix.casdoor == 'latest' && 'casbin/casdoor-all-in-one:latest' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the Node bundle
        run: npm run build:node

      - name: End-to-end test
        run: node scripts/e2e-casdoor.ts ${IMAGE:+"$IMAGE"}
