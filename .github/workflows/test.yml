name: Test

# Runs on PRs and main: typecheck, tests inside the Workers runtime and in plain Node, a dry-run Workers
# bundle, the single-file Node bundle and the SDK package builds, then the packages' plain-Node checks against
# what was built. The image job builds the container image, runs it with throwaway values as a deployment
# would and smoke tests it. The typecheck is a separate step because wrangler and esbuild strip types without
# checking them. Nothing here deploys or publishes; deployments pick a commit or a release and run it
# themselves.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test packages under Node
        run: npm run test:node --workspaces --if-present

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only to run the scripts, which need nothing installed
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build image
        run: docker build --tag identity-bridge:test .

      # A configuration on .example hosts and a key generated for this run, through the environment only
      - name: Start the image
        run: |
          node scripts/dev-env.ts > "$RUNNER_TEMP/dev.env"
          docker run --detach --name identity-bridge --env-file "$RUNNER_TEMP/dev.env" \
            --publish 127.0.0.1:8080:8080 identity-bridge:test

      - name: Wait for the health check
        run: |
          for _ in $(seq 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' identity-bridge)
            if [ "$health" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo "::error::the container is still $health after 30 s"
          exit 1

      - name: Check the user
        run: |
          if [ "$(docker exec identity-bridge id -u)" = 0 ]; then
            echo "::error::the container runs as root"
            exit 1
          fi

      - name: Smoke test
        run: node scripts/smoke.ts http://127.0.0.1:8080 acme

      # Docker's default grace period, 10 s, matches the one the bundle gives requests in flight
      - name: Stop
        run: |
          docker stop identity-bridge
          code=$(docker inspect --format '{{.State.ExitCode}}' identity-bridge)
          if [ "$code" != 0 ]; then
            echo "::error::the container exited with $code"
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs identity-bridge || true
